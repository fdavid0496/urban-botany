# =============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# =============================================================================
spring.application.name=urban-botany
server.port=8080

# =============================================================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# =============================================================================
# Ajusta 'localhost:3306' si tu puerto de MySQL es diferente
spring.datasource.url=jdbc:mysql://localhost:3306/urban_botany_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =============================================================================
# 'update': Actualiza/crea la estructura automáticamente sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update

# Muestra y formatea las consultas SQL en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# CONFIGURACIÓN DE THYMELEAF (Frontend)
# =============================================================================
# Desactiva la caché en desarrollo para ver cambios en HTML/CSS de inmediato
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# =============================================================================
# CONFIGURACIÓN DE CARGA DE ARCHIVOS (Imágenes de productos)
# =============================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# SPRING DEVTOOLS (Recarga rápida en desarrollo)
# =============================================================================
spring.devtools.add-properties=true
spring.devtools.restart.enabled=true