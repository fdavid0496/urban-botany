<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-CO" class="h-100">

<!-- Reutiliza la cabecera head centralizada -->
<head th:replace="~{layout/header :: head}"></head>

<body class="d-flex flex-column h-100 bg-light">

    <!-- Reutiliza la barra de navegación -->
    <nav th:replace="~{layout/navbar :: navbar}"></nav>

    <!-- Contenido Principal de Error -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
                    <div class="card-body">
                        
                        <!-- Ícono y Código de Error 403 -->
                        <div class="mb-4">
                            <i class="bi bi-shield-lock-fill text-danger display-1"></i>
                            <h1 class="fw-bold text-danger display-4 mt-2">403</h1>
                            <h3 class="fw-semibold text-dark">Acceso Denegado</h3>
                        </div>

                        <!-- Mensaje de Error Dinámico -->
                        <p class="text-muted fs-5 mb-4" 
                           th:text="${message} ?: 'No tienes los permisos necesarios para acceder a esta sección restringida.'">
                            No tienes los permisos necesarios para acceder a esta sección restringida.
                        </p>

                        <!-- Botón de Regreso -->
                        <a th:href="@{/products}" class="btn btn-success btn-lg px-4 rounded-pill shadow-sm">
                            <i class="bi bi-house-door-fill me-2"></i> Volver al Catálogo
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Reutiliza el pie de página -->
    <footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
