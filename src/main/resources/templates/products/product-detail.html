<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es-CO" class="h-100">

<!-- Reutiliza la cabecera head centralizada -->
<head th:replace="~{layout/header :: head}"></head>

<body class="d-flex flex-column h-100 bg-light">

    <!-- Reutiliza la barra de navegación -->
    <nav th:replace="~{layout/navbar :: navbar}"></nav>

    <!-- Contenido Principal -->
    <main class="container my-auto py-5">
        
        <!-- Migas de Pan (Breadcrumbs) -->
        <nav aria-label="Navegación secundaria" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/products}" class="text-success text-decoration-none"><i class="bi bi-house-door-fill me-1"></i> Catálogo</a></li>
                <li class="breadcrumb-item text-muted" th:text="${product.categoryName}">Categoría</li>
                <li class="breadcrumb-item active text-dark fw-semibold" aria-current="page" th:text="${product.name}">Nombre Producto</li>
            </ol>
        </nav>

        <!-- Tarjeta de Detalle del Producto -->
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="row g-0">
                
                <!-- Columna 1: Imagen Principal -->
                <div class="col-md-6 bg-white d-flex align-items-center justify-content-center p-4">
                    <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}" 
                         th:src="${product.imageUrl}" 
                         th:alt="${product.name}" 
                         class="img-fluid rounded-3 shadow-sm" style="max-height: 400px; object-fit: cover; width: 100%;">
                    
                    <img th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}" 
                         th:src="@{/images/products/placeholder.jpg}" 
                         alt="Planta de prueba" 
                         class="img-fluid rounded-3 shadow-sm" style="max-height: 400px; object-fit: cover; width: 100%;">
                </div>

                <!-- Columna 2: Información y Formulario de Compra -->
                <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-between">
                    <div>
                        <!-- Insignia de Categoría -->
                        <span class="badge bg-success bg-opacity-10 text-success fw-bold px-3 py-2 rounded-pill mb-2" 
                              th:text="${product.categoryName}">Categoría</span>

                        <!-- Nombre del Producto -->
                        <h2 class="display-6 fw-bold text-dark mb-3" th:text="${product.name}">Nombre de la Planta</h2>

                        <!-- Precio Unitario -->
                        <h3 class="fw-extrabold text-success mb-4 display-6" 
                            th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')}">$0.00</h3>

                        <!-- Descripción Detallada -->
                        <h6 class="fw-bold text-dark mb-2">Descripción del producto:</h6>
                        <p class="text-muted leading-relaxed mb-4" th:text="${product.description}">
                            Descripción detallada de las características, cuidados e información de la planta o artículo de jardinería.
                        </p>
                    </div>

                    <!-- Formulario de Selección de Cantidad e Inclusión al Carrito -->
                    <div class="border-top pt-4">
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}" />

                            <div class="row g-3 align-items-center">
                                <div class="col-auto">
                                    <label for="quantity" class="col-form-label fw-bold">Cantidad:</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" id="quantity" name="quantity" class="form-control form-control-lg text-center fw-bold" 
                                           value="1" min="1" max="99" style="width: 90px;" required>
                                </div>
                                <div class="col">
                                    <!-- Botón para Usuarios Autenticados -->
                                    <button sec:authorize="isAuthenticated()" type="submit" class="btn btn-success btn-lg w-100 rounded-3 shadow-sm fw-bold">
                                        <i class="bi bi-cart-plus-fill me-2"></i> Agregar al Carrito
                                    </button>

                                    <!-- Botón para Usuarios Anónimos (Redirige a Login) -->
                                    <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-success btn-lg w-100 rounded-3 fw-bold">
                                        <i class="bi bi-box-arrow-in-right me-2"></i> Inicia sesión para comprar
                                    </a>
                                </div>
                            </div>
                        </form>

                        <div class="mt-3 text-start">
                            <a th:href="@{/products}" class="text-muted text-decoration-none small">
                                <i class="bi bi-arrow-left me-1"></i> Regresar al catálogo completo
                            </a>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </main>

    <!-- Reutiliza el pie de página -->
    <footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
